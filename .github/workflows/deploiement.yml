# PUBLIER ATOUTMATH CHEZ SON HÉBERGEUR, À CHAQUE POUSSÉE.
#
# Rémy : « avec la possibilité d'actualiser le site facilement », puis, une fois
# l'hébergement en vue : « là on travaille sur github pour les mises à jour,
# sera-t-il possible de faire la même chose sur le futur site web ? »
#
# Oui, et c'est ce fichier. On pousse le code sur la branche principale, et une
# minute plus tard le site en ligne est à jour. Rien à transférer à la main,
# rien à oublier.
#
# DEUX TEMPS, ET C'EST LE CHANGEMENT IMPORTANT. Les tests tournent TOUJOURS —
# à chaque poussée, à chaque demande de fusion, que l'hébergement soit
# configuré ou non. La publication, elle, ne part qu'ensuite et seulement si
# les tests passent. Auparavant les deux étaient liés : un dépôt sans
# hébergement ne testait rien, et l'on ne s'en apercevait qu'en cassant
# quelque chose.
#
# CE QU'IL FAUT METTRE DANS GITHUB, une fois pour toutes :
#   Settings → Secrets and variables → Actions → New repository secret
#     HEBERGEUR_HOTE          l'adresse SFTP donnée par l'hébergeur
#     HEBERGEUR_UTILISATEUR   l'identifiant SFTP
#     HEBERGEUR_MOTDEPASSE    son mot de passe
#   et, si le site ne va pas à la racine, la variable (pas le secret) :
#     HEBERGEUR_DOSSIER       le chemin sur le serveur, par défaut « / »
#
# POURQUOI SFTP ET NON FTP. La plupart des hébergeurs proposent les deux ; le
# FTP simple fait voyager le mot de passe en clair. Le port 22 est celui du SFTP.
#
# ET POURQUOI CE FICHIER PLUTÔT QU'UN HÉBERGEUR « BRANCHÉ SUR GIT ». Parce qu'il
# rend le choix de l'hébergeur indifférent : tout hébergement qui donne un accès
# SFTP devient, avec ce fichier, un hébergement qui se met à jour tout seul à
# chaque poussée. On choisit donc sur le prix et sur le lieu, pas sur la
# présence d'un bouton GitHub dans le panneau d'administration.

name: Tests et publication

on:
  push:
    branches: [refonte-architecture]
  # Toute demande de fusion est testée : c'est là qu'on veut savoir, avant que
  # le code n'atteigne la branche qui publie.
  pull_request:
  # Et à la demande, depuis l'onglet Actions — pour republier sans rien changer.
  workflow_dispatch:
  # LA RONDE DU MATIN. Du lundi au vendredi à 6 h 10 (heure française d'été),
  # avant la première heure de cours, on va voir si le site est debout. Rien
  # n'est publié : on regarde, et l'on ne dit rien s'il n'y a rien à dire.
  #
  # POURQUOI SURVEILLER UN SITE QUI NE CHANGE PAS. Parce que c'est L'HÉBERGEMENT
  # qui change tout seul : un certificat qui expire, une version de PHP retirée,
  # une mise à jour du serveur qui n'applique plus les .htaccess. Aucun de ces
  # accidents ne vient d'une poussée, donc aucun ne serait vu par les contrôles
  # qui suivent une poussée. On l'apprendrait devant la classe.
  #
  # GitHub n'exécute les tâches programmées QUE sur la branche par défaut du
  # dépôt (`refonte-architecture`) : c'est là que ce fichier doit vivre pour que
  # la ronde ait lieu.
  schedule:
    - cron: '10 4 * * 1-5'

concurrency:
  # UNE SEULE PUBLICATION À LA FOIS. Deux transferts simultanés vers le même
  # dossier laisseraient le site à moitié dans une version et à moitié dans
  # l'autre — et le pire moment pour ça est justement celui où l'on corrige en
  # urgence.
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ Tests --
  tests:
    name: Tests
    # La ronde du matin ne teste rien : le code n'a pas bougé depuis la veille.
    # Elle ne fait que regarder le site en ligne.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2978 vérifications, un peu moins de quatre minutes. Aucune dépendance à
      # installer : les tests n'utilisent que le lanceur intégré de Node.
      - name: Le logiciel (npm test)
        run: npm test

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, mbstring, openssl
          coverage: none

      # LE SERVEUR AUSSI, et c'est nouveau. `npm test` ne connaît que le
      # JavaScript ; l'installation, l'administration et le chiffrement sont du
      # PHP, et une page qui s'affiche sans erreur ne prouve rien. Cet essai
      # lance un vrai serveur sur une base jetable et le pilote par HTTP —
      # cookies de session et jeton anti-rejeu compris.
      - name: Le serveur (tools/testApi.php)
        run: php tools/testApi.php

  # ------------------------------------------------------------- Publication --
  publier:
    name: Publier le site
    needs: tests
    # Seule la branche principale publie. Une demande de fusion est testée,
    # jamais mise en ligne.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/refonte-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que l'hébergement est configuré
        id: config
        run: |
          if [ -z "${{ secrets.HEBERGEUR_HOTE }}" ]; then
            echo "::notice::Aucun hébergement configuré (secret HEBERGEUR_HOTE absent) — rien à publier."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      # CE QUI NE PART PAS SUR LE SERVEUR : voir `.deployignore`. Le dépôt
      # contient de quoi développer — outils de mesure, tests, notes — et rien
      # de tout cela n'a sa place sur l'hébergement : c'est du poids, et c'est
      # de la surface exposée.
      #
      # ⚠ `delete_remote_files` DOIT RESTER À `false`, ET CE N'EST PAS UN
      # DÉTAIL DE CONFORT. `api/config.php` et `api/data/` ne sont PAS dans le
      # dépôt — ils sont créés sur le serveur par l'installation. Un transfert
      # qui « fait le ménage » les prendrait pour des intrus et les effacerait :
      # on perdrait la clé de chiffrement ET la base, c'est-à-dire le travail de
      # toutes les classes, en une publication de routine.
      #
      # C'est aussi ce qui rend une mise à jour sans danger : elle remplace les
      # fichiers du logiciel et ne touche à rien de ce qui appartient au site.
      - name: Publier par SFTP
        if: steps.config.outputs.pret == 'oui'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HEBERGEUR_HOTE }}
          username: ${{ secrets.HEBERGEUR_UTILISATEUR }}
          password: ${{ secrets.HEBERGEUR_MOTDEPASSE }}
          port: 22
          local_path: './*'
          remote_path: ${{ vars.HEBERGEUR_DOSSIER || '/' }}
          sftp_only: true
          delete_remote_files: false
          exclude_file: .deployignore

  # ------------------------------------------------------------- Vérification --
  #
  # Rémy : « et on peut automatiser cela ? »
  #
  # « Cela », c'était le dernier geste manuel : ouvrir `api/admin/sante.php`
  # après chaque publication et regarder si tout est vert. Ce travail-là est
  # désormais fait par `tools/controleEnLigne.mjs`, et il est fait DE DEHORS.
  #
  # C'est même mieux que la page de santé, et pour une raison de fond :
  # `sante.php` demande au serveur d'aller chercher ses propres fichiers, ce que
  # beaucoup d'hébergements interdisent — la page répond alors « je n'ai pas pu
  # vérifier », honnêtement, mais sans rien prouver. Ici, GitHub est vraiment le
  # visiteur inconnu, celui contre qui on se protège.
  #
  # SI CE CONTRÔLE ÉCHOUE, GitHub envoie un courriel. C'est tout ce qu'on
  # demande à une surveillance : se taire quand tout va bien, et prévenir une
  # fois quand ça ne va plus.
  verifier:
    name: Vérifier le site en ligne
    needs: publier
    # `always()` est indispensable : sans lui, cette tâche serait sautée en même
    # temps que `publier` — or la ronde du matin ne publie rien et doit
    # justement s'exécuter seule.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && (needs.publier.result == 'success' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contrôler
        env:
          SITE: ${{ vars.SITE_ADRESSE }}
        run: |
          if [ -z "$SITE" ]; then
            echo "::notice::Variable SITE_ADRESSE absente — pas de contrôle en ligne."
            echo "Renseignez-la dans Settings → Secrets and variables → Actions → Variables,"
            echo "par exemple : https://atoutmath.fr"
            exit 0
          fi
          # LE SITE VIENT D'ÊTRE TRANSFERTÉ : on laisse à l'hébergement le temps
          # d'écrire les derniers fichiers avant de lui demander des comptes.
          # Mesuré une fois, arbitraire ensuite — mais un faux rouge le matin
          # coûte plus cher que dix secondes d'attente.
          [ "${{ github.event_name }}" = "schedule" ] || sleep 10
          # `--version` : le numéro de cache que ce dépôt vient de publier. Le
          # contrôle vérifie que c'est bien CELUI-LÀ qui est servi, et non la
          # version d'avant restée en place parce que le transfert a échoué en
          # silence.
          node tools/controleEnLigne.mjs "$SITE" \
            --version="$(grep -om1 '?v=[0-9]\+' index.html | tr -dc '0-9')"
