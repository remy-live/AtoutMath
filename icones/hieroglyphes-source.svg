<!-- LES SEPT HIÉROGLYPHES DE RÉMY, tels qu'il les a dessinés.
     Fichier de RÉFÉRENCE : il n'est pas chargé par l'application. Les tracés
     sont recopiés dans `js/core/figures.js`, remis à l'échelle d'une case de
     24 × 32. On garde l'original ici pour pouvoir y revenir : un glyphe
     retouché à la main dans le code, sans son modèle à côté, ne se corrige
     plus.
     Ordre de dessin = ordre des valeurs :
       id3 = 1        (le bâton)
       id4 = 10       (l'anse)
       id5 = 100      (la corde enroulée)
       id6 = 1 000    (la fleur de lotus)
       id7+id8 = 10 000    (le doigt, avec son ongle)
       id9 = 100 000       (le têtard)
       id10..id16 = 1 000 000 (le dieu Heh, bras levés) -->
